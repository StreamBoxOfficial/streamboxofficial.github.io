<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#000000">

<title>StreamBox Live</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #player {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: #000;
    }

    #message {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
    }
</style>
</head>

<body>

<iframe
    id="player"
    title="StreamBox Live Player"
    scrolling="no"
    allowfullscreen
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen">
</iframe>

<div id="message"></div>

<script>
const player = document.getElementById("player");
const message = document.getElementById("message");

function showError(text) {
    player.style.display = "none";
    message.textContent = text;
    message.style.display = "flex";
}

const params = new URLSearchParams(window.location.search);
const streamUrl = params.get("url");

if (!streamUrl) {
    showError("No stream selected");
} else {
    try {
        const parsed = new URL(streamUrl);

        const validHost =
            parsed.hostname === "embed.st" ||
            parsed.hostname.endsWith(".embed.st");

        if (parsed.protocol !== "https:" || !validHost) {
            showError("Invalid stream URL");
        } else {
            player.src = parsed.href;
        }
    } catch (e) {
        showError("Invalid stream URL");
    }
}

/*
 * Mobile browsers normally require a user gesture before
 * fullscreen/orientation requests are allowed.
 */
async function requestPlayerMode() {
    try {
        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        }
    } catch (e) {}

    try {
        if (screen.orientation &&
            screen.orientation.lock) {
            await screen.orientation.lock("landscape");
        }
    } catch (e) {}
}

/*
 * First interaction with our page can request fullscreen/
 * landscape where the browser permits it.
 */
document.addEventListener("click", requestPlayerMode, {
    once: true
});

document.addEventListener("touchend", requestPlayerMode, {
    once: true
});
</script>

</body>
</html>
